---
- name: Update Ubuntu and install baseline packages
  hosts: linux
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - net-tools
          - stress
        state: present

